<svg viewBox="0 0 1000 640" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Serif TC',serif">
<defs>
<linearGradient id="f2sea" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#aacfe4"/><stop offset=".5" stop-color="#8fbdd8"/><stop offset="1" stop-color="#79aecb"/>
