<g font-size="15" fill="#2b2318">
 <circle cx="588" cy="78" r="6" fill="#8a6d3b" stroke="#f7f2e7" stroke-width="1.5"/><text x="600" y="84">迦巴勒（比布羅斯）</text>
 <circle cx="582" cy="178" r="5.5" fill="#8a6d3b" stroke="#f7f2e7" stroke-width="1.5"/><text x="594" y="184">貝魯特</text>
 <circle cx="572" cy="268" r="7" fill="#8a6d3b" stroke="#f7f2e7" stroke-width="1.5"/><text x="586" y="274" font-weight="bold">西頓</text>
 <circle cx="566" cy="330" r="4.5" fill="#8a6d3b" stroke="#f7f2e7" stroke-width="1.2"/><text x="578" y="336" font-size="12.5">撒勒法（王上17:9）</text>
 <circle cx="600" cy="540" r="6" fill="#8a6d3b" stroke="#f7f2e7" stroke-width="1.5"/><text x="613" y="546">亞柯</text>
 <circle cx="836" cy="198" r="7" fill="#8a6d3b" stroke="#f7f2e7" stroke-width="1.5"/><text x="850" y="204" font-weight="bold">大馬士革</text>
 <circle cx="790" cy="655" r="7" fill="#8a6d3b" stroke="#f7f2e7" stroke-width="1.5"/><text x="804" y="661" font-weight="bold">耶路撒冷</text>
</g>

<!-- TYRE island -->
<ellipse cx="512" cy="398" rx="34" ry="26" fill="#cfe0ea" opacity=".8" filter="url(#f1soften)"/>
<ellipse cx="512" cy="398" rx="24" ry="18" fill="url(#f1land)" stroke="#8a7a55" stroke-width="1.5"/>
<ellipse cx="512" cy="398" rx="18" ry="13" fill="none" stroke="#66023c" stroke-width="2.5"/>
<g fill="#66023c">
 <rect x="509" y="382.5" width="5" height="5"/><rect x="493" y="395" width="5" height="5"/>
 <rect x="526" y="395" width="5" height="5"/><rect x="509" y="408" width="5" height="5"/>
</g>
<text x="404" y="390" font-size="24" font-weight="bold" fill="#66023c">推羅</text>
<text x="398" y="410" font-size="12" fill="#66023c" letter-spacing="2" font-style="italic">TYRE（島城）</text>
<circle cx="570" cy="412" r="5" fill="#a05b78" stroke="#f7f2e7" stroke-width="1.2"/>
<text x="580" y="430" font-size="12.5" fill="#6b4a5a">舊推羅（烏樹）</text>

<!-- trade routes -->
<g stroke="#66023c" stroke-width="2.2" stroke-dasharray="9 7" fill="none" opacity=".7">
 <path d="M 478 392 C 380 360 250 320 130 300"/>
 <path d="M 486 416 C 420 490 340 590 265 655"/>
</g>
<path d="M 130 300 l 18 -3 l -13 13 Z" fill="#66023c" opacity=".85" transform="rotate(188 130 300)"/>
<path d="M 265 655 l 18 -3 l -13 13 Z" fill="#66023c" opacity=".85" transform="rotate(128 265 655)"/>
<text x="52" y="282" font-size="13.5" fill="#66023c">往迦太基・他施（西班牙）</text>
<text x="180" y="686" font-size="13.5" fill="#66023c">往埃及・挪弗</text>

<!-- Cyprus -->
<path d="M 96 96 C 116 86 152 88 166 98 C 178 108 150 118 126 116 C 106 114 88 106 96 96 Z" fill="url(#f1land)" stroke="#b9a87e" stroke-width="1.5" filter="url(#f1coastshadow)"/>
<text x="94" y="140" font-size="12.5" fill="#7a6a4e">基提（塞浦路斯）</text>

<!-- sea label -->
<text x="230" y="420" font-size="27" fill="#5a86a0" letter-spacing="14" font-style="italic" opacity=".9">大　海</text>
<text x="212" y="450" font-size="14" fill="#6d95ac" font-style="italic" letter-spacing="2">The Great Sea（地中海）</text>

<!-- compass -->
<g transform="translate(88 600)">
 <circle r="26" fill="#f7efd8" stroke="#b39a5e" stroke-width="2" filter="url(#f1cardshadow)"/>
 <circle r="20" fill="none" stroke="#c9b587" stroke-width="1"/>
 <path d="M 0 -17 L 4 0 L 0 17 L -4 0 Z" fill="#8c1f28"/>
 <path d="M -17 0 L 0 4 L 17 0 L 0 -4 Z" fill="#7a6a4e"/>
 <text y="-32" text-anchor="middle" font-size="12" fill="#7a6a4e">北</text>
</g>

<!-- scale -->
<g transform="translate(770 694)">
 <rect x="0" y="0" width="60" height="6" fill="#2b2318"/><rect x="60" y="0" width="60" height="6" fill="#f7efd8" stroke="#2b2318" stroke-width="1"/>
 <text x="0" y="-6" font-size="11" fill="#5a4a28">0</text><text x="52" y="-6" font-size="11" fill="#5a4a28">25</text><text x="106" y="-6" font-size="11" fill="#5a4a28">50 公里</text>
 <text x="128" y="6" font-size="10.5" fill="#8d7a55">（示意）</text>
</g>

<!-- title cartouche -->
<g filter="url(#f1cardshadow)">
 <rect x="28" y="26" width="342" height="92" rx="8" fill="url(#f1titlebg)" stroke="#b39a5e" stroke-width="2"/>
 <rect x="34" y="32" width="330" height="80" rx="5" fill="none" stroke="#d3c193" stroke-width="1"/>
</g>
<text x="48" y="62" font-size="23" font-weight="bold" fill="#2b2318" letter-spacing="2">推羅與腓尼基海岸</text>
<text x="48" y="86" font-size="13.5" fill="#66023c" font-style="italic" letter-spacing="1">Tyre and the Phoenician Coast</text>
<text x="48" y="105" font-size="11.5" fill="#7a6a4e">約主前9世紀｜城市位置與距離為示意重繪</text>
</svg>
