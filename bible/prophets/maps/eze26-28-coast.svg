<svg viewBox="0 0 1000 720" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Serif TC',serif">
<defs>
<linearGradient id="f1sea" x1="0" y1="0" x2="1" y2="1">
 <stop offset="0" stop-color="#aacfe4"/><stop offset=".5" stop-color="#8fbdd8"/><stop offset="1" stop-color="#79aecb"/>
</linearGradient>
<linearGradient id="f1land" x1="0" y1="0" x2=".6" y2="1">
 <stop offset="0" stop-color="#efe3c0"/><stop offset=".55" stop-color="#e9d9ae"/><stop offset="1" stop-color="#e3cf9f"/>
</linearGradient>
<linearGradient id="f1desertE" x1="0" y1="0" x2="1" y2=".3">
 <stop offset="0" stop-color="#e7d3a0" stop-opacity="0"/><stop offset="1" stop-color="#dab97a" stop-opacity=".85"/>
</linearGradient>
<radialGradient id="f1seaglow" cx=".3" cy=".3" r="1">
 <stop offset="0" stop-color="#cfe6f2"/><stop offset="1" stop-color="#8fbdd8" stop-opacity="0"/>
</radialGradient>
<linearGradient id="f1titlebg" x1="0" y1="0" x2="0" y2="1">
 <stop offset="0" stop-color="#f7efd8"/><stop offset="1" stop-color="#efe0b8"/>
</linearGradient>
<filter id="f1soften" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
<filter id="f1coastshadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="-4" dy="3" stdDeviation="5" flood-color="#4a6d84" flood-opacity=".45"/>
</filter>
<filter id="f1cardshadow" x="-20%" y="-20%" width="140%" height="140%">
 <feDropShadow dx="2" dy="3" stdDeviation="4" flood-color="#5a4a28" flood-opacity=".4"/>
</filter>
<g id="f1mt">
 <path d="M 0 0 L 13 -22 L 26 0 Z" fill="#c3ad82" stroke="#8d7a55" stroke-width=".8"/>
 <path d="M 13 -22 L 26 0 L 13 0 Z" fill="#a58c62"/>
</g>
</defs>

<!-- parchment & sea -->
<rect width="1000" height="720" fill="#f2e9d0"/>
<rect x="0" y="0" width="1000" height="720" fill="url(#f1sea)"/>
<rect x="0" y="0" width="560" height="420" fill="url(#f1seaglow)" opacity=".7"/>
<g stroke="#c8e0ee" stroke-width="2" fill="none" opacity=".45">
 <path d="M 60 150 q 45 -10 90 0 t 90 0 t 90 0"/>
 <path d="M 110 250 q 45 -10 90 0 t 90 0 t 90 0"/>
 <path d="M 60 350 q 45 -10 90 0 t 90 0 t 90 0"/>
 <path d="M 120 460 q 45 -10 90 0 t 90 0 t 90 0"/>
 <path d="M 70 570 q 45 -10 90 0 t 90 0 t 90 0"/>
 <path d="M 150 660 q 45 -10 90 0 t 90 0 t 90 0"/>
</g>

<!-- landmass -->
<path d="M 588 0 C 580 45 592 85 584 125 C 576 165 590 205 578 245
         C 566 285 574 325 566 365 C 558 400 564 435 572 470
         C 580 510 596 540 606 580 C 616 622 606 672 612 720
         L 1000 720 L 1000 0 Z"
      fill="url(#f1land)" stroke="#b9a87e" stroke-width="2" filter="url(#f1coastshadow)"/>
<rect x="860" y="0" width="140" height="720" fill="url(#f1desertE)"/>

<!-- terrain shading -->
<ellipse cx="702" cy="165" rx="42" ry="125" fill="#b7a37b" opacity=".45" filter="url(#f1soften)"/>
<ellipse cx="795" cy="620" rx="55" ry="60" fill="#c0aa7e" opacity=".4" filter="url(#f1soften)"/>

<!-- Lebanon range -->
<g>
 <use href="#f1mt" x="672" y="88"/><use href="#f1mt" x="694" y="118"/><use href="#f1mt" x="676" y="150"/>
 <use href="#f1mt" x="700" y="180"/><use href="#f1mt" x="682" y="212"/><use href="#f1mt" x="706" y="242"/>
 <use href="#f1mt" x="688" y="272"/>
 <text x="736" y="150" font-size="15" fill="#7a6a4e" letter-spacing="5" transform="rotate(72 736 150)">黎巴嫩山脈</text>
 <text x="668" y="66" font-size="11.5" fill="#8d7a55">香柏樹之地</text>
</g>
