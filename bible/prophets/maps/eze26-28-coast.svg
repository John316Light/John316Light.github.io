<path d="M 604 592 L 616 572 L 628 592 Z" fill="#c3ad82" stroke="#8d7a55" stroke-width=".8"/>
<text x="632" y="590" font-size="12.5" fill="#7a6a4e">迦密山</text>

<!-- rivers & lake -->
<path d="M 706 292 C 700 320 680 335 640 348 C 606 358 580 364 566 370" stroke="#6fa8c8" stroke-width="3" fill="none" opacity=".85"/>
<text x="624" y="340" font-size="11" fill="#4d86ab" transform="rotate(-12 624 340)">利他尼河</text>
<ellipse cx="716" cy="512" rx="15" ry="22" fill="#6fa8c8" stroke="#4d86ab" stroke-width="1"/>
<text x="736" y="512" font-size="12" fill="#4d86ab">加利利海</text>
<path d="M 790 272 C 780 320 722 420 716 490" stroke="#6fa8c8" stroke-width="2.2" fill="none" opacity=".8"/>
<path d="M 716 534 C 714 580 726 650 730 720" stroke="#6fa8c8" stroke-width="2.6" fill="none" opacity=".85"/>
<text x="737" y="628" font-size="11" fill="#4d86ab" transform="rotate(84 737 628)">約旦河</text>

<!-- Damascus oasis -->
<ellipse cx="836" cy="198" rx="26" ry="14" fill="#a8bf7e" opacity=".55" filter="url(#f1soften)"/>

<!-- region labels -->
<text x="636" y="330" font-size="19" fill="#7c6a3f" letter-spacing="6" transform="rotate(-72 636 330)" opacity=".9">腓 尼 基</text>
<text x="672" y="556" font-size="15" fill="#7a6a4e" letter-spacing="4">加利利</text>
<text x="856" y="248" font-size="14" fill="#7a6a4e" letter-spacing="3">亞蘭（大馬士革）</text>
<text x="806" y="700" font-size="14" fill="#7a6a4e" letter-spacing="3">猶大山地</text>

