<path d="M 772 268 L 790 234 L 808 268 Z" fill="#cdbb96" stroke="#8d7a55" stroke-width="1"/>
<path d="M 785 244 L 790 234 L 795 244 L 790 248 Z" fill="#f4efe2"/>
<text x="812" y="262" font-size="12.5" fill="#7a6a4e">黑門山</text>
