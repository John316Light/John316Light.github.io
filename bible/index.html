<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聖經研究 · 書卷</title>
<style>
  :root{--parchment:#f7f2e7;--card:#fffdf7;--ink:#2b2318;--soft:#6b5d4a;--purple:#66023c;--gold:#b08d3e;--sea:#2e5f74;--line:#e2d8c3;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--parchment);color:var(--ink);font-family:"Noto Serif TC","Songti TC","PMingLiU",Georgia,serif;line-height:1.9;}
  .wrap{max-width:900px;margin:0 auto;padding:34px 26px 90px;}
  .back{margin-bottom:8px;}
  .back a{font-size:14px;color:var(--soft);text-decoration:none;}
  .back a:hover{color:var(--purple);}
  header.hero{text-align:center;padding:44px 20px 34px;border-bottom:3px double var(--gold);margin-bottom:14px;}
  .hero .kicker{letter-spacing:.4em;color:var(--purple);font-size:13px;margin-bottom:14px;}
  .hero h1{font-size:40px;margin:0 0 14px;letter-spacing:.1em;font-weight:700;}
  .hero .sub{color:var(--soft);font-size:16px;max-width:560px;margin:0 auto;}
  h2.sec{font-size:20px;color:var(--purple);margin:44px 0 4px;letter-spacing:.05em;border-left:5px solid var(--gold);padding-left:14px;}
  .sec-note{color:var(--soft);font-size:14.5px;margin:4px 0 18px;padding-left:19px;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;}
  a.card,div.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;box-shadow:0 2px 10px rgba(60,40,10,.05);transition:.16s;}
  a.card:hover{box-shadow:0 6px 20px rgba(102,2,60,.14);transform:translateY(-2px);border-color:var(--gold);}
  .card .tag{display:inline-block;font-size:12px;letter-spacing:.14em;color:var(--purple);background:#f3e7ef;border-radius:20px;padding:3px 11px;margin-bottom:11px;}
  .card h3{margin:0 0 8px;font-size:20px;letter-spacing:.03em;}
  .card p{margin:0;font-size:14.5px;color:var(--soft);line-height:1.75;}
  div.card.soon{opacity:.62;background:#f4efe3;border-style:dashed;}
  div.card.soon .tag{color:var(--soft);background:#eae1cf;}
  footer{margin-top:64px;padding-top:20px;border-top:1px solid var(--line);color:var(--soft);font-size:13px;text-align:center;line-height:1.8;}
</style>
</head>
<body>
<div class="wrap">

<div class="back"><a href="../">← 首頁（LIFE）</a></div>

<header class="hero">
  <div class="kicker">研 讀 · 逐 卷 累 積</div>
  <h1>聖經研究</h1>
  <div class="sub">按書卷分門整理——逐卷細讀、繪製地圖、放回正典整體與救贖歷史的進程裡衡量。</div>
</header>

<h2 class="sec">已開放的研究<span></span></h2>
<div class="sec-note">點入即可閱讀。</div>
<div class="grid">
  <a class="card" href="prophets/">
    <span class="tag">先知書</span>
    <h3>先知書研究</h3>
    <p>十二小先知與以西結的導讀系列、推羅背景研究與四張古典地圖。</p>
  </a>
</div>

<h2 class="sec">籌備中<span></span></h2>
<div class="sec-note">陸續開展；完成後會出現在上方。</div>
<div class="grid">
  <div class="card soon">
    <span class="tag">摩西五經</span>
    <h3>摩西五經研究</h3>
    <p>創世記至申命記的敘事、律法與神學脈絡。（籌備中）</p>
  </div>
  <div class="card soon">
    <span class="tag">利未記</span>
    <h3>利未記研究</h3>
    <p>聖潔、獻祭與「分別聖俗」的祭司神學。（籌備中）</p>
  </div>
  <div class="card soon">
    <span class="tag">福音書</span>
    <h3>福音書研究</h3>
    <p>四福音的敘事、神學重點與彼此對照。（籌備中）</p>
  </div>
</div>

<footer>
  聖經研究 · 解經與生活的累積 · 由 Kai 整理
</footer>

</div>
</body>
</html>
